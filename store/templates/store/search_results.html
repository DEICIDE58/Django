{% extends 'store/base.html' %}

{% block content %}
<div class="container">

    <h2>Search Results for "{{ query }}"</h2>

    {% if items %}
        {% for item in items %}
            <div>
                <h3>{{ item.name }}</h3>
                <p>Price: {{ item.price }}</p>
                <a href="{% url 'product_detail' item.pk %}">View</a>
            </div>
            <hr>
        {% endfor %}
    {% else %}
        <p>No products found.</p>
    {% endif %}

</div>
{% endblock %}
